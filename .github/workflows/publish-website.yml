name: Publish website

on:
  push:
    branches:
      - development
    paths:
      - "website/**"
      - ".github/workflows/publish-website.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up environment
        uses: ./.github/actions/setup

      # Generate the knowledge bundle demo with the actual code of Kiso cli ============================================
      - name: build and run tests
        continue-on-error: true
        run: |
          just generate_website_demo

      # Generate the knowledge bundle demo with the latest release of Kiso cli =========================================
      - name: Build with Kiso
        uses: oak-invest/kiso/applications/kiso-cli-action@v0.1.5
        with:
          command: build
          source: examples/kb-google-example
          destination: website/examples/kb-google-example-latest

      # Publish the website to GitHub Pages ============================================================================
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5