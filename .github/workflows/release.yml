name: Release

on:
  push:
    tags: [ '*' ]

permissions:
  contents: write

jobs:

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            artifact: kiso-cli-linux-x64
            executable: kiso
          - os: macos-latest
            name: macos-arm64
            artifact: kiso-cli-macos-arm64
            executable: kiso
          - os: windows-latest
            name: windows-x64
            artifact: kiso-cli-windows-x64.exe
            executable: kiso.exe

    steps:

      - name: Retrieve the sources
        uses: actions/checkout@v7

      - name: Set up environment
        uses: ./.github/actions/setup

      - name: Build native executable
        run: |
          just build_native

      - name: Rename executable
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp applications/kiso-cli/target/kiso-cli.exe dist/${{ matrix.artifact }}
          else
            cp applications/kiso-cli/target/kiso-cli dist/${{ matrix.artifact }}
            chmod +x dist/${{ matrix.artifact }}
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true