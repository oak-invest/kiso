name: Release

on:
  push:
    tags: [ '*' ]

permissions:
  contents: write

jobs:

  build-native:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            cli_artifact: kiso-cli-linux-x64
            mcp_artifact: kiso-mcp-server-linux-x64
          - os: macos-latest
            name: macos-arm64
            cli_artifact: kiso-cli-macos-arm64
            mcp_artifact: kiso-mcp-server-macos-arm64
          - os: windows-latest
            name: windows-x64
            cli_artifact: kiso-cli-windows-x64.exe
            mcp_artifact: kiso-mcp-server-windows-x64.exe

    steps:

      - name: Retrieve the sources
        uses: actions/checkout@v7

      - name: Set up environment
        uses: ./.github/actions/setup

      - name: Build native executable
        run: |
          just release_build_native

      - name: Copy executables
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp applications/kiso-cli/target/kiso-cli.exe dist/${{ matrix.cli_artifact }}
            cp applications/kiso-mcp-server/target/kiso-mcp-server.exe dist/${{ matrix.mcp_artifact }}
          else
            cp applications/kiso-cli/target/kiso-cli dist/${{ matrix.cli_artifact }}
            chmod +x dist/${{ matrix.cli_artifact }}
            cp applications/kiso-mcp-server/target/kiso-mcp-server dist/${{ matrix.mcp_artifact }}
            chmod +x dist/${{ matrix.mcp_artifact }}
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.cli_artifact }}
          path: dist/${{ matrix.cli_artifact }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.mcp_artifact }}
          path: dist/${{ matrix.mcp_artifact }}

  build-java:
    name: Build Java release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:

      - name: Retrieve the sources
        uses: actions/checkout@v7

      - name: Set up environment
        uses: ./.github/actions/setup

      - name: Build executable Java release
        run: |
          just install
          mvn package -pl applications/kiso-cli -am -DskipTests
          mkdir -p dist
          cp applications/kiso-cli/target/kiso-cli-*-executable.jar dist/kiso-cli.jar

      - uses: actions/upload-artifact@v7
        with:
          name: kiso-cli.jar
          path: dist/kiso-cli.jar

  release:
    name: Publish GitHub Release
    needs: [ build-native, build-java ]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: false
