name: "Kiso"
description: "Check and build an OKF knowledge bundle with Kiso"

inputs:
  version:
    description: "Kiso CLI version to use, for example v0.1.5"
    required: false
    default: "v0.1.5"
  command:
    description: "Kiso command: build"
    required: false
    default: "build"
  source:
    description: "Directory containing the Markdown files to read. Defaults to the current directory."
    required: false
    default: "."
  destination:
    description: "Directory where generated files are created. Defaults to the public directory."
    required: false
    default: "public"
  profile:
    description: "Kiso profile to use for building the knowledge bundle."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Download Kiso cli
      shell: bash
      run: |
        curl -L -o kiso-cli https://github.com/oak-invest/kiso/releases/download/${{ inputs.version }}/kiso-cli-linux-x64
        chmod +x kiso-cli

    - name: Run Kiso cli
      shell: bash
      run: |
        ./kiso-cli ${{ inputs.command }} \
          --source "${{ inputs.source }}" \
          --destination "${{ inputs.destination }}" \
          --profile "${{ inputs.profile }}"