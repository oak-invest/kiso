name: "Kiso"
description: "Check and build an OKF knowledge bundle with Kiso"

inputs:
  version:
    description: "Kiso CLI version to use, for example v0.2.0"
    required: false
    default: "v0.2.0"
  command:
    description: "Kiso command, for example 'check' or 'build'"
    required: true
  source:
    description: "Directory containing the Markdown files to read. Defaults to the current directory."
    required: false
    default: "."
  destination:
    description: "Directory where generated files are created. Defaults to the public directory."
    required: false
    default: "public"
  profile:
    description: "Kiso profile to use for building the knowledge bundle."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Download Java runtime
      shell: bash
      run: |
        java_home="$RUNNER_TEMP/kiso-java"
        java_archive="$RUNNER_TEMP/kiso-java.tar.gz"
        mkdir -p "$java_home"
        curl -fsSL -o "$java_archive" "https://api.adoptium.net/v3/binary/latest/21/ga/linux/x64/jre/hotspot/normal/eclipse"
        tar -xzf "$java_archive" -C "$java_home" --strip-components=1

    - name: Download Kiso cli
      shell: bash
      run: |
        curl -fsSL -o kiso-cli.jar https://github.com/oak-invest/kiso/releases/download/${{ inputs.version }}/kiso-cli.jar

    - name: Run Kiso cli
      shell: bash
      run: |
        java="$RUNNER_TEMP/kiso-java/bin/java"
        arguments=(
          "${{ inputs.command }}"
          --source "${{ inputs.source }}"
          --destination "${{ inputs.destination }}"
        )
        if [[ -n "${{ inputs.profile }}" ]]; then
          arguments+=(--profile "${{ inputs.profile }}")
        fi
        "$java" -jar kiso-cli.jar "${arguments[@]}"
